  :root{
    --sans:"Overused Grotesk","Inter",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --label:"Spectral",Georgia,"Times New Roman",serif;
    --ink:#eef1f5; --muted:rgba(233,238,244,.62); --faint:rgba(233,238,244,.42);
    --dark:#04060b;

    /* ↓↓↓ EDIT ME: darkness over the sky photo. 0 = none, 1 = solid black.
       Higher = dots stand out more, photo recedes. Try 0.4–0.7.            */
    --overlay: 0.45;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--sans); color:var(--muted); background:var(--dark);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  /* the meteor sky */

  #sky::after{ /* gentle vignette so text + dots read */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 100% at 50% 45%, transparent 52%, rgba(2,4,9,.72) 100%);
  }
  /* flat dark wash over the photo, beneath the stars — opacity set by --overlay above */
  #sky-dim{ position:absolute; inset:0; z-index:1; pointer-events:none; background:#000; opacity:var(--overlay); }

  /* header */
  .head{ position:fixed; top:0; left:0; right:0; z-index:5; padding:5vh 6vw; pointer-events:none; }
  .head .label{ font-family:var(--label); text-transform:uppercase; letter-spacing:.26em; font-size:.66rem; color:var(--faint); }
  .head h1{ font-family:var(--sans); font-weight:400; color:var(--ink); font-size:clamp(1.7rem,3.4vw,2.8rem); letter-spacing:-.015em; margin:.5rem 0 .7rem; }
  .head p{ font-family:var(--sans); font-weight:300; color:var(--muted); font-size:.98rem; max-width:30rem; margin:0; line-height:1.6; }
  .head .count{ color:var(--ink); }
  .back{ pointer-events:auto; position:fixed; top:5vh; right:6vw; z-index:6;
    font-family:var(--label); text-transform:uppercase; letter-spacing:.22em; font-size:.66rem;
    color:var(--faint); text-decoration:none; transition:color .3s ease; }
  .back:hover{ color:var(--ink); }

  /* stars */
  .star{
    position:absolute; z-index:4; border:none; background:none; padding:0; cursor:pointer;
    font-family:"Segoe UI Symbol","Apple Symbols",system-ui,"Noto Sans Symbols",sans-serif;
    font-size:var(--s,18px); line-height:1; color:var(--c,#cfe0f5);
    text-shadow:0 0 3px #fff, 0 0 7px rgba(255,255,255,.95), 0 0 15px var(--c,#cfe0f5), 0 0 26px var(--c,#cfe0f5);
    transform:translate(-50%,-50%); transition:transform .25s ease, text-shadow .25s ease;
    animation:glow var(--tw,4s) ease-in-out infinite;
    user-select:none; -webkit-user-select:none;
  }
  .star:hover, .star:focus-visible{
    outline:none; transform:translate(-50%,-50%) scale(1.9);
    text-shadow:0 0 5px #fff, 0 0 12px #fff, 0 0 24px var(--c,#cfe0f5), 0 0 46px var(--c,#cfe0f5);
  }
  @keyframes glow{ 0%,100%{opacity:.7;} 50%{opacity:1;} }

  /* detail panel */
  .panel{
    position:fixed; z-index:8; left:50%; bottom:6vh; transform:translateX(-50%) translateY(20px);
    width:min(560px,88vw); padding:1.6rem 1.7rem 1.5rem;
    background:rgba(8,12,20,.82); backdrop-filter:blur(10px);
    border:1px solid rgba(233,238,244,.18); border-radius:8px;
    opacity:0; pointer-events:none; transition:opacity .4s ease, transform .4s ease;
  }
  .panel.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .panel .pk{ font-family:var(--label); text-transform:uppercase; letter-spacing:.22em; font-size:.6rem; color:var(--faint); margin-bottom:.5rem; }
  .panel .beyond{ font-family:var(--sans); font-weight:300; color:var(--ink); font-size:clamp(1.15rem,2vw,1.5rem); line-height:1.45; }
  .panel .stays{ font-family:var(--sans); font-weight:300; color:var(--muted); font-size:.98rem; line-height:1.55; margin-top:1rem; }
  .panel .stays .lbl{ font-family:var(--label); font-style:italic; color:var(--faint); }
  .panel .sig{ font-family:var(--label); font-style:italic; color:var(--faint); font-size:.9rem; margin-top:1.1rem; }
  .panel .close{ position:absolute; top:.7rem; right:.9rem; background:none; border:none; color:var(--faint); font-size:1.3rem; line-height:1; cursor:pointer; }
  .panel .close:hover{ color:var(--ink); }

  /* empty / loading */
  .note{ position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; text-align:center; padding:8vw; }
  .note p{ font-family:var(--sans); font-weight:300; color:var(--muted); max-width:26rem; line-height:1.7; }
  .note a{ color:var(--ink); }
  .hidden{ display:none; }

  @media (max-width:720px){
    .head{ padding:3.4vh 7vw; } .back{ top:3.4vh; right:7vw; }
    .head p{ font-size:.9rem; }
  }
  @media (prefers-reduced-motion: reduce){ .star{ animation:none; } }
</style>
</head>
<body>

<div id="sky"><div id="sky-dim"></div></div>

<div class="head">
  <div class="label">The Starmaker · a sky of wishes</div>
  <h1>The night is already full.</h1>
  <p>Every light is a wish someone could no longer carry, hung here to keep burning. <span class="count" id="count"></span> Touch one to hear it.</p>
</div>
<a class="back" href="index.html">← make a star</a>

<div class="note" id="note"><p id="note-text">Lighting the sky…</p></div>

<div class="panel" id="panel" role="dialog" aria-modal="false">
  <button class="close" id="close" aria-label="close">×</button>
  <div class="pk">a wish sent beyond</div>
  <div class="beyond" id="p-beyond"></div>
  <div class="stays" id="p-stays"></div>
  <div class="sig" id="p-sig"></div>
</div>

<script src="config.js"></script>
<script>
  const CFG = (window.STARMAKER_CFG) || { url:"", key:"" };
  const LIVE = /^https:\/\/.+\.supabase\.co/.test(CFG.url) && CFG.key && CFG.key.length > 20;
  const Wishes = {
    async list(){
      if(LIVE){
        const r = await fetch(CFG.url + "/rest/v1/wishes?select=*&order=created_at.asc", {
          headers:{ apikey:CFG.key, Authorization:"Bearer "+CFG.key }
        });
        if(!r.ok) throw new Error(await r.text());
        return await r.json();
      }
      try{ return JSON.parse(localStorage.getItem("starmaker_wishes")||"[]"); }catch(e){ return []; }
    }
  };

  const sky = document.getElementById('sky');
  const panel = document.getElementById('panel');
  const note = document.getElementById('note');
  const noteText = document.getElementById('note-text');
  const countEl = document.getElementById('count');
  const seen = new Set();

  // stable pseudo-random from an id, for stars with no stored x/y
  function hash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))>>>0; } return h; }
  function place(w){
    if(typeof w.x === 'number' && typeof w.y === 'number') return {x:w.x, y:w.y};
    const h = hash(String(w.id||Math.random()));
    return { x: 10 + (h % 1000)/1000*80, y: 12 + ((h>>10) % 1000)/1000*74 };
  }

  // sparkle glyphs + pastel palette drawn from the Shelley Labs logo
  const GLYPHS = ['⊹','₊','˖','·','✦','✧','݁','.'];
  const COLORS = ['#d9b8ea','#c4baf0','#b9ccf2','#cfe3f7','#f2c6da','#f6d4e3','#e9d8f2','#eef1f5'];

  function addStar(w){
    const id = String(w.id);
    if(seen.has(id)) return; seen.add(id);
    const {x,y} = place(w);
    const h = hash(id);
    const b = document.createElement('button');
    b.className = 'star';
    b.textContent = GLYPHS[h % GLYPHS.length];
    b.style.setProperty('--c', COLORS[(h >> 3) % COLORS.length]);
    const size = 15 + (h % 16);               // 15–30px, varied
    b.style.setProperty('--s', size+'px');
    b.style.setProperty('--tw', (3 + (h % 40)/10) + 's');
    b.style.left = x + '%'; b.style.top = y + '%';
    b.setAttribute('aria-label','a wish');
    b.addEventListener('click', ()=>open(w));
    sky.appendChild(b);
  }

  function open(w){
    document.getElementById('p-beyond').textContent = w.beyond || '';
    const stays = document.getElementById('p-stays');
    if(w.stays){ stays.innerHTML = '<span class="lbl">what they still wanted here — </span>' + escapeHtml(w.stays); stays.classList.remove('hidden'); }
    else stays.classList.add('hidden');
    document.getElementById('p-sig').textContent = '— ' + (w.name ? w.name : 'someone, unnamed');
    panel.classList.add('show');
  }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  document.getElementById('close').addEventListener('click', ()=>panel.classList.remove('show'));
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') panel.classList.remove('show'); });

  async function refresh(){
    let list;
    try{ list = await Wishes.list(); }
    catch(e){ noteText.innerHTML = 'The sky is unreachable right now. Check back in a moment.'; note.classList.remove('hidden'); console.error(e); return; }
    if(!list.length){
      noteText.innerHTML = 'No wishes yet. <a href="index.html">Be the first to hang one →</a>';
      note.classList.remove('hidden');
    } else {
      note.classList.add('hidden');
      list.forEach(addStar);
    }
    countEl.textContent = list.length ? (list.length + (list.length===1?' wish burning.':' wishes burning.')) : '';
  }

  refresh();
  setInterval(refresh, 12000);   // new stars drift in every 12s
</script>
</body>
</html>
